services:
  gotenberg:
    image: gotenberg/gotenberg:8-libreoffice
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PDF_MODE: gotenberg
      GOTENBERG_BASE_URL: http://gotenberg:3000
      APP_ALLOWED_ORIGINS: http://localhost:5173
      APP_STORAGE_TTL_MINUTES: "60"
    depends_on:
      - gotenberg

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
